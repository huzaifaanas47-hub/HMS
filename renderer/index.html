<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>HMS</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { display: flex; flex-direction: column; overflow: hidden; user-select: none; }

  /* ---- top bar ---- */
  #topbar { height: 48px; flex: 0 0 48px; display: flex; align-items: flex-end; gap: 6px; padding: 0 10px 0 12px; background: var(--bg-elev); border-bottom: 1px solid var(--border); }
  #brand { display: flex; align-items: center; gap: 8px; height: 100%; padding-right: 12px; margin-right: 4px; border-right: 1px solid var(--border-soft); font-weight: 700; letter-spacing: .4px; font-size: 14px; }
  #brand .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #3b82f6, #22d3ee); display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 800; }

  #tabs { display: flex; align-items: flex-end; gap: 3px; min-width: 0; overflow-x: auto; overflow-y: hidden; height: 100%; padding-top: 8px; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab-btn { position: relative; flex: 0 1 auto; min-width: 96px; max-width: 200px; height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 13px; color: var(--text-dim); cursor: pointer; border-radius: 9px 9px 0 0; border: 1px solid transparent; border-bottom: none; transition: background .12s, color .12s; }
  .tab-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: #3a4663; flex: 0 0 7px; transition: background .12s; }
  .tab-btn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab-btn:hover { background: rgba(255,255,255,.05); color: var(--text); }
  .tab-btn.active { background: var(--bg); color: #fff; border-color: var(--border); }
  .tab-btn.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--bg); }
  .tab-btn.active::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 2px; border-radius: 2px; background: var(--accent); }
  .tab-btn.active .dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  #add-btn { flex: 0 0 30px; height: 30px; margin: 0 0 9px 4px; border: none; border-radius: 8px; background: transparent; color: var(--text-dim); font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
  #add-btn:hover { background: rgba(255,255,255,.08); color: #fff; }

  #actions { margin-left: auto; display: flex; align-items: center; gap: 4px; height: 100%; padding-left: 8px; }
  #expiry { display: none; align-items: center; height: 26px; padding: 0 10px; margin-right: 6px; border-radius: 13px; font-size: 12px; font-weight: 600; color: var(--warn); background: rgba(251,191,36,.12); border: 1px solid rgba(251,191,36,.28); white-space: nowrap; }
  .icon-btn { height: 32px; min-width: 32px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; background: transparent; color: var(--text-dim); border-radius: 8px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 16px; }
  .icon-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
  .icon-btn.good:hover { color: var(--ok); }
  .icon-btn.bad:hover { color: var(--danger); background: rgba(248,113,113,.12); }
  .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  @media (max-width: 980px) { .icon-btn .lbl { display: none; } }

  /* ---- lock / access screen ---- */
  #lock { display: none; position: fixed; top: 48px; left: 0; right: 0; bottom: 0; background: radial-gradient(1000px 500px at 50% -10%, #17223d 0%, var(--bg) 60%); align-items: center; justify-content: center; padding: 24px; user-select: text; }
  #lock.show { display: flex; }
  #lock .card { width: 100%; max-width: 440px; text-align: center; padding: 34px 32px 28px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  #lock .badge { width: 54px; height: 54px; margin: 0 auto 16px; border-radius: 16px; display: grid; place-items: center; background: var(--accent-soft); color: #7fb0ff; }
  #lock .badge svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #lock h1 { font-size: 21px; font-weight: 700; margin: 0 0 8px; }
  #lock p { color: var(--text-dim); font-size: 14px; line-height: 1.55; margin: 0 0 8px; }
  #lock-msg { color: var(--warn) !important; font-size: 13px !important; }
  #enroll-form { display: none; margin-top: 18px; }
  #enroll-form.show { display: block; }
  #enroll-code { width: 100%; padding: 14px; font-size: 24px; font-weight: 600; letter-spacing: 5px; text-align: center; text-transform: uppercase; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: #fff; outline: none; font-family: Consolas, "Courier New", monospace; }
  #enroll-code:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #enroll-error { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 10px; }
  #lock button.primary { margin-top: 12px; width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  #lock button.primary:hover { background: var(--accent-hover); }
  #lock button.primary:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
  <div id="topbar">
    <div id="brand"><span class="logo">H</span><span>HMS</span></div>
    <div id="tabs"></div>
    <button id="add-btn" title="Add a tab" aria-label="Add a tab">+</button>
    <div id="actions">
      <div id="expiry"></div>
      <button class="icon-btn" id="reload-btn" title="Reload this tab (Ctrl+R)">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg><span class="lbl">Reload</span>
      </button>
      <button class="icon-btn good" id="fill-login-btn" title="Fill the saved login on this tab">
        <svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4"/><path d="m18 5 2 2"/><path d="m15 8 2 2"/></svg><span class="lbl">Fill Login</span>
      </button>
      <button class="icon-btn bad" id="logout-btn" title="Clear the saved session of the current tab">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg><span class="lbl">Log Out Tab</span>
      </button>
      <span class="sep"></span>
      <button class="icon-btn" id="settings-btn" title="Add, rename or remove tabs">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="lbl">Tabs</span>
      </button>
    </div>
  </div>

  <div id="lock">
    <div class="card">
      <div class="badge"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
      <h1 id="lock-title">Access unavailable</h1>
      <p id="lock-text"></p>
      <p id="lock-msg"></p>
      <form id="enroll-form" autocomplete="off">
        <input id="enroll-code" maxlength="12" placeholder="XXXX-XXXX" spellcheck="false" autocapitalize="characters">
        <div id="enroll-error" role="alert"></div>
        <button id="enroll-btn" class="primary" type="submit">Join</button>
      </form>
      <button id="recheck" class="primary">Check again</button>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
