<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>HMS</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="topbar.css">
</head>
<body>
  <header id="topbar">
    <div id="brand" aria-label="HMS">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.6 3.2 8 8 9 4.8-1 8-4.4 8-9V6z"/><path d="M12 8.5v6M9 11.5h6"/></svg>
      </span>
      <span class="wordmark">HMS</span>
    </div>

    <div id="tabs" role="tablist" aria-label="Role tabs"></div>
    <button id="add-btn" type="button" title="Add or edit tabs" aria-label="Add or edit tabs">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <div id="actions">
      <!-- shows which site the active tab is really on, and whether the connection is encrypted -->
      <div id="site-chip" class="chip hidden" role="status">
        <svg class="ico ico-secure" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <svg class="ico ico-local" viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/></svg>
        <svg class="ico ico-insecure" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>
        <span id="site-host"></span>
      </div>
      <div id="expiry" class="chip warn hidden" role="status"></div>
      <button id="update-btn" class="chip update hidden" type="button" title="A newer version of HMS is available. Click to download it."></button>

      <button class="icon-btn" id="reload-btn" type="button" title="Reload this tab (Ctrl+R)" aria-label="Reload this tab">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg><span class="lbl">Reload</span>
      </button>
      <button class="icon-btn good" id="fill-login-btn" type="button" title="Fill the saved login on this tab" aria-label="Fill the saved login on this tab">
        <svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4"/><path d="m18 5 2 2"/><path d="m15 8 2 2"/></svg><span class="lbl">Fill Login</span>
      </button>
      <button class="icon-btn bad" id="logout-btn" type="button" title="Clear the saved session of the current tab" aria-label="Log out of this tab">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg><span class="lbl">Log Out Tab</span>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button class="icon-btn" id="settings-btn" type="button" title="Add, rename or remove tabs" aria-label="Tab settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="lbl">Tabs</span>
      </button>
    </div>

    <div id="progress" aria-hidden="true"></div>
  </header>

  <div id="lock" role="dialog" aria-modal="true" aria-labelledby="lock-title">
    <div class="card">
      <div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
      <h1 id="lock-title">Access unavailable</h1>
      <p id="lock-text"></p>
      <p id="lock-msg"></p>
      <form id="enroll-form" class="hidden" autocomplete="off">
        <input id="enroll-code" maxlength="9" placeholder="XXXX-XXXX" spellcheck="false" autocapitalize="characters" autocomplete="off" autocorrect="off" aria-label="Access code">
        <div id="enroll-error" role="alert"></div>
        <button id="enroll-btn" class="primary" type="submit">Join</button>
      </form>
      <button id="recheck" type="button" class="primary">Check again</button>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
