<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Setup — Multi-Role Portal</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    background: #1e2430;
    color: #e6e9ef;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #8b93a5; font-size: 13px; margin: 0 0 20px; }
  .row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    align-items: center;
  }
  .row label { width: 90px; font-size: 12px; color: #8b93a5; flex-shrink: 0; }
  .row input {
    flex: 1;
    padding: 9px 10px;
    border-radius: 6px;
    border: 1px solid #333c4d;
    background: #12161f;
    color: #fff;
    font-size: 13px;
  }
  .row input.label-input { flex: 0 0 130px; }
  button#save {
    margin-top: 18px;
    background: #2e6bf2;
    color: #fff;
    border: none;
    padding: 11px 20px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
  }
  button#save:hover { background: #2559cf; }
  .hint { font-size: 11px; color: #6b7284; margin-top: 24px; line-height: 1.5; }
</style>
</head>
<body>
  <h1>Configure Your Role Tabs</h1>
  <p class="sub">Enter a label and login URL for each of your 7 roles. Each tab keeps its own separate, saved session (cookies/login) — logging into one won't affect the others.</p>
  <div id="rows"></div>
  <button id="save">Save & Continue</button>
  <div class="hint">You can change these later from the main window menu: File → Edit Tab URLs.</div>
  <script src="setup.js"></script>
</body>
</html>
