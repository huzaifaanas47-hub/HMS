name: Build installers

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]   # a tag like v2.1.0 (must match package.json version) publishes a GitHub Release = the update
  workflow_dispatch: {}

permissions:
  contents: write

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

jobs:
  # Creates the GitHub Release once, so the parallel build jobs don't each create their own.
  prepare:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "HMS ${GITHUB_REF_NAME#v}" --notes ""

  windows:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: windows-latest
    env:
      HAS_WIN_CERT: ${{ secrets.WIN_CERT_P12_BASE64 != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # Signed when the WIN_CERT_* secrets exist (base64 .pfx + its password). The two steps are separate because an
      # EMPTY CSC_LINK makes electron-builder fail ("not a file"), so the variables must not exist at all when unsigned.
      - name: Build Windows installer (signed)
        if: env.HAS_WIN_CERT == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: npx electron-builder --win nsis --publish ${{ env.PUBLISH }}

      - name: Build Windows installer (unsigned)
        if: env.HAS_WIN_CERT != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish ${{ env.PUBLISH }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: HMS-Installer
          path: dist/*.exe

  mac:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: macos-latest
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # With the MAC_CERT_* + APPLE_* secrets the app is signed with a Developer ID and notarized (needed for
      # auto-update on macOS). Without them it falls back to the ad-hoc build (manual install, no auto-update).
      - name: Build macOS (Developer ID signed + notarized)
        if: env.HAS_MAC_CERT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish ${{ env.PUBLISH }} -c.mac.notarize=true

      - name: Build macOS (ad-hoc, unsigned)
        if: env.HAS_MAC_CERT != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --publish ${{ env.PUBLISH }} -c.mac.identity=-

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: HMS-Installer-Mac
          path: dist/*.dmg

  linux:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # AppImage (any distro, also self-updates) + .deb (Debian/Ubuntu/Mint), for Intel/AMD (x64) and ARM (arm64).
      - name: Build Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage deb --x64 --arm64 --publish ${{ env.PUBLISH }}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: HMS-Installer-Linux
          path: |
            dist/*.AppImage
            dist/*.deb

  android:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      # An APK must be signed to install, and an update only installs over an older version signed with the SAME key.
      # Add the four ANDROID_* repository secrets (see README) to keep one key for ever; without them a fresh key is made per build.
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            PASS="$KS_PASS"; ALIAS="$KS_ALIAS"; KEYPASS="${KS_KEYPASS:-$KS_PASS}"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a temporary key. Updates will not install over a previous build."
            PASS=$(openssl rand -hex 12); ALIAS=hms; KEYPASS="$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -storepass "$PASS" -keypass "$KEYPASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=HMS"
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEYPASS" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/*.apk "dist-android/HMS-$VER-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: HMS-Installer-Android
          path: dist-android/*.apk

      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist-android/*.apk --clobber
